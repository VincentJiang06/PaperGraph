# Golden self-test pipeline: one data stage (c1). Mirrors the real per-run contract.
stages:
  c1:
    wdir: ../..
    cmd: python3 runs/_smoke/transforms/c1.py
    deps:
      - runs/_smoke/transforms/c1.py
      - data/_smoke_postings.csv
    metrics:
      - runs/_smoke/metrics/c1.json:
          cache: false
