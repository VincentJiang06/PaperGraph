# Gate-2 reproducibility pipeline: one stage per kind=data claim.
# wdir ../.. runs each transform from the repo root, so deps/metrics are repo-root-relative
# and transforms read the shared data/ directly. `dvc repro` re-executes; dvc.lock records
# the md5 of each raw dep + transform + produced metric = the provenance trail (可回溯).
stages:
  c1:
    wdir: ../..
    cmd: python3 runs/ai-employment/transforms/c1.py
    deps:
      - runs/ai-employment/transforms/c1.py
      - data/labor/unrate.csv
    metrics:
      - runs/ai-employment/metrics/c1.json:
          cache: false
